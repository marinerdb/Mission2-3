<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>따라 그리기 연습장</title>
<style>
  :root {
    --cream: #f6eddb;
    --paper: #fffdf8;
    --ink: #4b3a2a;
    --ink-soft: #7a6650;
    --line: #d9c7a6;
    --accent: #c9604a;
    --accent-dark: #a94a36;
    --bar: 48px;
  }
  * { box-sizing: border-box; }
  [hidden] { display: none !important; }
  html, body { margin: 0; }
  body {
    font-family: "Apple SD Gothic Neo", "Malgun Gothic", "Noto Sans KR", system-ui, sans-serif;
    color: var(--ink);
    background:
      radial-gradient(circle at 20% 10%, rgba(255,255,255,.55), transparent 45%),
      radial-gradient(circle at 85% 90%, rgba(201,96,74,.08), transparent 40%),
      var(--cream);
    min-height: 100vh;
    line-height: 1.5;
  }
  .app { max-width: 1080px; margin: 0 auto; padding: 16px 16px 56px; }

  /* 머리글: 오른쪽 위에 저장 버튼 */
  .head { display: flex; flex-direction: column; margin-bottom: 18px; }
  .head-inner { text-align: center; }
  .head h1 { margin: 0; font-size: clamp(26px, 5.5vw, 40px); letter-spacing: -0.5px; }
  .head h1::after {
    content: ""; display: block; width: 120px; height: 6px; margin: 8px auto 0;
    border-radius: 3px; background: repeating-linear-gradient(90deg, var(--accent) 0 10px, transparent 10px 16px);
    opacity: .7;
  }
  .lead { margin: 10px 0 0; color: var(--ink-soft); font-size: 15px; }
  #saveBtn { align-self: flex-end; order: -1; margin-bottom: 8px; padding: 8px 20px; }
  @media (min-width: 640px) {
    .head { display: grid; grid-template-columns: 1fr auto 1fr; align-items: start; }
    .head::before { content: ""; }
    #saveBtn { order: 0; align-self: start; justify-self: end; margin: 4px 0 0; }
  }

  .board { display: grid; grid-template-columns: minmax(0, 1fr); gap: 26px; }
  @media (min-width: 760px) {
    .board { grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); align-items: start; }
  }
  .col { min-width: 0; }

  .frame {
    margin: 0; background: var(--paper); padding: 14px 14px 12px; border-radius: 6px;
    border: 1px solid #eadfc8; box-shadow: 0 8px 20px rgba(75, 58, 42, .16);
  }
  .frame .label { font-weight: 700; margin: 0 0 8px; font-size: 16px; }

  /* 정사각형 칸 + 오른쪽 세로 도구 막대 */
  .stage { position: relative; display: flex; align-items: flex-start; gap: 8px; }
  .square {
    position: relative; flex: 1 1 0; min-width: 0; aspect-ratio: 1 / 1; background: #fff;
    border: 1px solid #e5dccb; overflow: hidden;
  }
  .square canvas { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
  #drawCanvas { touch-action: none; cursor: crosshair; -webkit-touch-callout: none; user-select: none; }

  .vbar { flex: none; width: var(--bar); display: flex; flex-direction: column; gap: 6px; }
  .vsep { height: 1px; background: var(--line); margin: 2px 6px; }
  .vbtn {
    display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px;
    width: var(--bar); min-height: 50px; padding: 5px 0; border-radius: 12px;
    font-size: 11px; line-height: 1.1; letter-spacing: -0.3px; white-space: nowrap;
  }
  .vbtn svg { width: 22px; height: 22px; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; flex: none; }
  .vbtn[data-off="1"] { opacity: .5; }
  .cdot { display: block; width: 22px; height: 22px; border-radius: 50%; border: 2px solid rgba(0,0,0,.2); flex: none; }

  .popover {
    position: absolute; right: calc(var(--bar) + 8px); top: 0; z-index: 10;
    background: var(--paper); border: 1px solid #d9c7a6; border-radius: 12px; padding: 12px;
    box-shadow: 0 10px 26px rgba(60, 40, 20, .28); width: 210px; max-width: calc(100% - var(--bar) - 8px);
  }
  .pop-title { display: flex; justify-content: space-between; align-items: center; gap: 8px; font-size: 13px; font-weight: 700; color: var(--ink-soft); margin-bottom: 8px; }
  .swatches { display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px; justify-items: center; margin-bottom: 12px; }
  .swatch {
    width: 32px; height: 32px; border-radius: 50%; padding: 0; min-height: 0;
    border: 2px solid rgba(0,0,0,.18);
  }
  .swatch[aria-pressed="true"] { outline: 3px solid var(--ink); outline-offset: 2px; border-color: #fff; }
  .custom { display: flex; align-items: center; justify-content: space-between; gap: 8px; font-size: 14px; }
  .custom input { width: 44px; height: 32px; padding: 0; border: 1px solid #cdb98f; border-radius: 6px; background: #fff; cursor: pointer; }
  .preview {
    width: 44px; height: 44px; border-radius: 8px; border: 1px solid #e5dccb; background: #fff;
    display: grid; place-items: center; flex: none;
  }
  .preview i { display: block; border-radius: 50%; }
  .size-row { display: flex; align-items: center; gap: 10px; }
  .size-row input[type="range"] { flex: 1; min-width: 0; }

  button, .btn {
    font: inherit; color: var(--ink); background: #fff; border: 1.5px solid #cdb98f;
    border-radius: 999px; padding: 8px 16px; cursor: pointer; min-height: 40px;
  }
  button:hover:not(:disabled) { background: #fbf3e2; }
  button:disabled { opacity: .45; cursor: not-allowed; }
  button:focus-visible, input:focus-visible, .swatch:focus-visible { outline: 3px solid #4d8fe8; outline-offset: 2px; }
  button.primary { background: var(--accent); border-color: var(--accent-dark); color: #fff; font-weight: 700; }
  button.primary:hover:not(:disabled) { background: var(--accent-dark); }
  button[aria-pressed="true"]:not(.swatch), button[aria-pressed="true"]:not(.swatch):hover:not(:disabled),
  button.vbtn[aria-expanded="true"], button.vbtn[aria-expanded="true"]:hover:not(:disabled) {
    background: var(--ink); color: #fff; border-color: var(--ink);
  }
  .vbtn[aria-expanded="true"] .cdot { border-color: #fff; }

  .empty {
    position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center;
    justify-content: center; gap: 14px; padding: 16px; text-align: center;
    background: rgba(255, 253, 248, .94); border: 3px dashed var(--line); margin: 8px;
    color: var(--ink-soft);
  }
  .empty p { margin: 0; font-size: 15px; }
  .frame.drag .square { outline: 4px solid var(--accent); outline-offset: -4px; }
  .frame.drag .empty { background: rgba(255, 236, 226, .96); }

  .file-info { margin: 10px 0 0; color: var(--ink-soft); font-size: 14px; overflow-wrap: anywhere; min-height: 21px; }

  input[type="range"] { width: 100%; accent-color: var(--accent); margin: 4px 0; }
  .switch { display: inline-flex; align-items: center; gap: 10px; cursor: pointer; font-weight: 700; font-size: 14px; }
  .switch input { position: absolute; opacity: 0; width: 1px; height: 1px; }
  .switch .track { width: 46px; height: 26px; border-radius: 13px; background: #d6cbb6; position: relative; transition: background .15s; flex: none; }
  .switch .track::after {
    content: ""; position: absolute; top: 3px; left: 3px; width: 20px; height: 20px; border-radius: 50%;
    background: #fff; box-shadow: 0 1px 3px rgba(0,0,0,.3); transition: transform .15s;
  }
  .switch input:checked + .track { background: var(--accent); }
  .switch input:checked + .track::after { transform: translateX(20px); }
  .switch input:focus-visible + .track { outline: 3px solid #4d8fe8; outline-offset: 2px; }

  .credit { margin: 26px 0 0; font-size: 13px; color: var(--ink-soft); text-align: center; }

  .status {
    position: fixed; left: 50%; bottom: 18px; transform: translate(-50%, 20px); opacity: 0; pointer-events: none;
    max-width: calc(100vw - 32px); padding: 11px 18px; border-radius: 12px; background: var(--ink); color: #fff;
    font-size: 15px; box-shadow: 0 6px 18px rgba(0,0,0,.28); transition: opacity .2s, transform .2s; z-index: 60;
    overflow-wrap: anywhere; text-align: center;
  }
  .status.show { opacity: 1; transform: translate(-50%, 0); }
  .status.error { background: #a63a2a; }

  .modal {
    position: fixed; inset: 0; background: rgba(50, 36, 22, .5); display: flex; align-items: center; justify-content: center;
    padding: 16px; z-index: 50;
  }
  .modal-box { background: var(--paper); border-radius: 14px; padding: 22px 20px 18px; max-width: 400px; width: 100%; box-shadow: 0 14px 40px rgba(0,0,0,.35); margin: 0; }
  .modal-box p { margin: 0 0 14px; font-size: 16px; font-weight: 700; }
  .modal-box .hint { font-size: 13px; font-weight: 400; color: var(--ink-soft); margin: 8px 0 16px; }
  .modal-box input[type="text"] {
    width: 100%; font: inherit; padding: 9px 12px; border: 1.5px solid #cdb98f; border-radius: 10px; background: #fff; color: var(--ink); min-height: 44px;
  }
  .modal-actions { display: flex; gap: 10px; justify-content: flex-end; }

  @media (max-width: 480px) {
    .app { padding: 10px 10px 48px; }
    .frame { padding: 10px 10px 8px; }
    .stage { gap: 6px; }
    .popover { right: calc(var(--bar) + 6px); }
  }
</style>
</head>
<body>
<main class="app">
  <header class="head">
    <div class="head-inner">
      <h1>따라 그리기 연습장</h1>
      <p class="lead">따라 그릴 이미지를 불러와 오른쪽 칸에 그려 보세요.</p>
    </div>
    <button type="button" class="primary" id="saveBtn">이미지로 저장</button>
  </header>

  <section class="board">
    <div class="col">
      <figure class="frame" id="srcFrame">
        <figcaption class="label">원본</figcaption>
        <div class="stage">
          <div class="square" id="srcSquare">
            <canvas id="srcCanvas" width="1000" height="1000" role="img" aria-label="불러온 원본 이미지"></canvas>
            <div class="empty" id="srcEmpty">
              <p>여기로 이미지를 끌어다 놓으세요</p>
              <button type="button" class="primary" id="pickBtn">이미지 선택</button>
              <p>JPG, PNG 파일을 불러올 수 있어요.</p>
            </div>
          </div>
          <div class="vbar" role="toolbar" aria-orientation="vertical" aria-label="원본 도구">
            <button type="button" class="vbtn" id="changeBtn" aria-label="다른 이미지 선택" title="다른 이미지 선택">
              <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><path d="M17 8l-5-5-5 5"/><path d="M12 3v12"/></svg>
              <span>이미지</span>
            </button>
            <button type="button" class="vbtn" id="resetBtn" aria-label="새로 시작" title="새로 시작" disabled>
              <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 12a9 9 0 1 0 9-9 9.75 9.75 0 0 0-6.74 2.74L3 8"/><path d="M3 3v5h5"/></svg>
              <span>새로 시작</span>
            </button>
          </div>
        </div>
      </figure>
      <p class="file-info" id="fileInfo"></p>
      <input type="file" id="fileInput" accept="image/png,image/jpeg,.png,.jpg,.jpeg" hidden>
    </div>

    <div class="col">
      <figure class="frame">
        <figcaption class="label">내 그림</figcaption>
        <div class="stage" id="drawStage">
          <div class="square" id="drawSquare">
            <canvas id="guideCanvas" width="1000" height="1000" aria-hidden="true"></canvas>
            <canvas id="drawCanvas" width="1000" height="1000" role="img" aria-label="내 그림을 그리는 그림판"></canvas>
          </div>

          <div class="vbar" role="toolbar" aria-orientation="vertical" aria-label="그림판 도구">
            <button type="button" class="vbtn" id="penBtn" aria-pressed="true" aria-label="펜" title="펜">
              <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M17 3a2.83 2.83 0 1 1 4 4L7.5 20.5 2 22l1.5-5.5L17 3z"/></svg>
              <span>펜</span>
            </button>
            <button type="button" class="vbtn" id="eraserBtn" aria-pressed="false" aria-label="지우개" title="지우개">
              <svg viewBox="0 0 24 24" aria-hidden="true"><path d="m7 21-4.3-4.3c-1-1-1-2.5 0-3.4l9.6-9.6c1-1 2.5-1 3.4 0l5.6 5.6c1 1 1 2.5 0 3.4L13 21"/><path d="M22 21H7"/><path d="m5 11 9 9"/></svg>
              <span>지우개</span>
            </button>
            <button type="button" class="vbtn" id="undoBtn" aria-label="되돌리기" title="되돌리기" disabled>
              <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M9 14 4 9l5-5"/><path d="M4 9h10.5a5.5 5.5 0 0 1 5.5 5.5v0a5.5 5.5 0 0 1-5.5 5.5H11"/></svg>
              <span>되돌리기</span>
            </button>
            <div class="vsep" aria-hidden="true"></div>
            <button type="button" class="vbtn" id="colorBtn" aria-haspopup="true" aria-expanded="false" aria-controls="colorPop" aria-label="색상" title="색상">
              <span class="cdot" id="colorDot"></span>
              <span>색상</span>
            </button>
            <button type="button" class="vbtn" id="sizeBtn" aria-haspopup="true" aria-expanded="false" aria-controls="sizePop" aria-label="굵기" title="굵기">
              <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 6h16" stroke-width="1.2"/><path d="M4 12h16" stroke-width="2.6"/><path d="M4 19h16" stroke-width="4.4"/></svg>
              <span>굵기</span>
            </button>
            <button type="button" class="vbtn" id="guideBtn" aria-haspopup="true" aria-expanded="false" aria-controls="guidePop" aria-label="흐린 가이드" title="흐린 가이드">
              <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="3" width="18" height="18" rx="2"/><circle cx="9" cy="9" r="2"/><path d="m21 15-3.1-3.1a2 2 0 0 0-2.8 0L6 21"/></svg>
              <span>가이드</span>
            </button>
          </div>

          <div class="popover" id="colorPop" role="group" aria-label="색상 고르기" hidden>
            <div class="pop-title"><span>색상</span></div>
            <div class="swatches" id="swatches"></div>
            <label class="custom">직접 고르기 <input type="color" id="colorInput" value="#000000"></label>
          </div>
          <div class="popover" id="sizePop" role="group" aria-label="굵기 고르기" hidden>
            <div class="pop-title"><label for="sizeRange">굵기</label><span id="sizeVal">4</span></div>
            <div class="size-row">
              <input type="range" id="sizeRange" min="1" max="30" step="1" value="4">
              <span class="preview" aria-hidden="true"><i id="previewDot"></i></span>
            </div>
          </div>
          <div class="popover" id="guidePop" role="group" aria-label="흐린 가이드 설정" hidden>
            <div class="pop-title">
              <label class="switch"><input type="checkbox" id="guideOn" role="switch" checked><span class="track"></span><span>흐린 가이드</span></label>
            </div>
            <div class="pop-title"><label for="guideRange">농도</label><span id="guideVal">30%</span></div>
            <input type="range" id="guideRange" min="5" max="100" step="1" value="30">
          </div>
        </div>
      </figure>
    </div>
  </section>

  <p class="credit">다른 사람의 작품을 따라 그린 그림을 SNS에 올릴 때는 원작자를 직접 밝혀 주세요.</p>
</main>

<div class="status" id="status" role="status" aria-live="polite"></div>

<!-- 확인 창(새 이미지 불러오기·새로 시작) -->
<div class="modal" id="modal" hidden role="dialog" aria-modal="true" aria-labelledby="modalMsg">
  <div class="modal-box">
    <p id="modalMsg"></p>
    <div class="modal-actions">
      <button type="button" id="modalCancel">취소</button>
      <button type="button" class="primary" id="modalOk">확인</button>
    </div>
  </div>
</div>

<!-- 저장 제목 창 -->
<div class="modal" id="saveModal" hidden role="dialog" aria-modal="true" aria-labelledby="saveModalTitle">
  <form class="modal-box" id="saveForm">
    <p id="saveModalTitle">저장할 이미지의 제목을 정해 주세요</p>
    <input type="text" id="titleInput" maxlength="60" placeholder="나의 따라 그리기" autocomplete="off" aria-label="제목">
    <p class="hint">비워 두면 ‘나의 따라 그리기’로 저장돼요.</p>
    <div class="modal-actions">
      <button type="button" id="saveCancel">취소</button>
      <button type="submit" class="primary" id="saveOk">저장</button>
    </div>
  </form>
</div>

<script>
(() => {
  'use strict';

  const SIZE = 1000;          // 그림판 내부 해상도(정사각형)
  const MAX_UNDO = 20;        // 되돌리기 가능 획 수
  const MAX_SRC = 1600;       // 큰 사진을 줄여서 쓰는 긴 변 길이
  const STORE_SRC = 1000;     // 자동 저장용 원본의 긴 변 길이
  const STORE_KEY = 'ttaragurigi:v2';
  const SAVE_DELAY = 400;     // 자동 저장 대기 시간(ms)
  const APP_NAME = '따라 그리기 연습장';
  const DEFAULT_TITLE = '나의 따라 그리기';
  const DEFAULT_COLOR = '#000000';
  const DEFAULT_SIZE = 4;
  const FONT_STACK = '"Nanum Pen Script","Segoe Print","Bradley Hand","Marker Felt","Apple SD Gothic Neo","Malgun Gothic","Noto Sans KR",sans-serif';
  const PALETTE = [
    ['검정', '#000000'], ['진회색', '#555555'], ['빨강', '#e03131'], ['주황', '#f76707'],
    ['노랑', '#fcc419'], ['연두', '#94d82d'], ['초록', '#2f9e44'], ['하늘', '#4dabf7'],
    ['파랑', '#1c63d6'], ['보라', '#7048e8'], ['분홍', '#f783ac'], ['갈색', '#8d5524']
  ];

  const $ = (id) => document.getElementById(id);
  const srcCanvas = $('srcCanvas'), guideCanvas = $('guideCanvas'), drawCanvas = $('drawCanvas');
  const srcCtx = srcCanvas.getContext('2d');
  const guideCtx = guideCanvas.getContext('2d');
  const drawCtx = drawCanvas.getContext('2d');
  const baseCanvas = document.createElement('canvas');
  baseCanvas.width = baseCanvas.height = SIZE;
  const baseCtx = baseCanvas.getContext('2d');

  // ---------- 상태 ----------
  let sourceImage = null;   // 줄여서 보관한 원본(canvas)
  let srcName = '';         // 불러온 파일 이름
  let srcDataUrl = null;    // 자동 저장용으로 줄여 둔 원본(캐시)
  let appTitle = '';        // 마지막으로 정한 제목
  let tool = 'pen';
  let color = DEFAULT_COLOR;
  let size = DEFAULT_SIZE;  // 화면 픽셀 기준 굵기
  let strokes = [];         // 최근 획(최대 MAX_UNDO)
  let baseDirty = false;    // 오래된 획이나 불러온 그림이 baseCanvas에 들어 있는지
  let cur = null;           // 지금 그리는 획
  let activePointer = null;
  let busy = false;

  // ---------- 알림 ----------
  const statusEl = $('status');
  let toastTimer = 0;
  function notify(msg, kind) {
    statusEl.textContent = msg;
    statusEl.className = 'status show' + (kind ? ' ' + kind : '');
    clearTimeout(toastTimer);
    toastTimer = setTimeout(() => statusEl.classList.remove('show'), 5000);
  }

  // ---------- 이미지 그리기 도우미 ----------
  function drawContain(ctx, img, x, y, w, h) {
    const s = Math.min(w / img.width, h / img.height);
    const dw = img.width * s, dh = img.height * s;
    ctx.drawImage(img, x + (w - dw) / 2, y + (h - dh) / 2, dw, dh);
  }
  function renderSource() {
    srcCtx.fillStyle = '#fff';
    srcCtx.fillRect(0, 0, SIZE, SIZE);
    guideCtx.clearRect(0, 0, SIZE, SIZE);
    if (!sourceImage) return;
    srcCtx.imageSmoothingQuality = 'high';
    guideCtx.imageSmoothingQuality = 'high';
    drawContain(srcCtx, sourceImage, 0, 0, SIZE, SIZE);
    drawContain(guideCtx, sourceImage, 0, 0, SIZE, SIZE);
  }

  // ---------- 획 그리기 ----------
  const mid = (a, b) => ({ x: (a.x + b.x) / 2, y: (a.y + b.y) / 2 });

  function applyStyle(ctx, s) {
    ctx.globalCompositeOperation = s.erase ? 'destination-out' : 'source-over';
    ctx.strokeStyle = s.color;
    ctx.fillStyle = s.color;
    ctx.lineWidth = s.size;
    ctx.lineCap = 'round';
    ctx.lineJoin = 'round';
  }
  function stepStroke(ctx, s, n) {
    const p = s.pts;
    ctx.beginPath();
    if (n === 1) {
      const m = mid(p[0], p[1]);
      ctx.moveTo(p[0].x, p[0].y);
      ctx.lineTo(m.x, m.y);
    } else {
      const a = mid(p[n - 2], p[n - 1]);
      const b = mid(p[n - 1], p[n]);
      ctx.moveTo(a.x, a.y);
      ctx.quadraticCurveTo(p[n - 1].x, p[n - 1].y, b.x, b.y);
    }
    ctx.stroke();
  }
  function finishStroke(ctx, s) {
    const p = s.pts, L = p.length - 1;
    if (L === 0) {
      ctx.beginPath();

    g.shadowOffsetY = 14;
    g.fillStyle = '#fffdf7';
    g.fillRect(-CW / 2, -CH / 2, CW, CH);
    g.shadowColor = 'transparent';
    g.strokeStyle = 'rgba(120,90,50,0.18)';
    g.lineWidth = 2;
    g.strokeRect(-CW / 2, -CH / 2, CW, CH);
    g.save();
    g.beginPath();
    g.rect(PX, PY, PS, PS);
    g.clip();
    paintPhoto(g, PX, PY, PS);
    const gloss = g.createLinearGradient(PX, PY, PX + PS, PY + PS);
    gloss.addColorStop(0, 'rgba(255,255,255,0.14)');
    gloss.addColorStop(0.5, 'rgba(255,255,255,0)');
    g.fillStyle = gloss;
    g.fillRect(PX, PY, PS, PS);
    g.restore();
    g.strokeStyle = 'rgba(0,0,0,0.12)';
    g.lineWidth = 2;
    g.strokeRect(PX, PY, PS, PS);
    g.fillStyle = '#6b5640';
    g.textAlign = 'center';
    g.textBaseline = 'middle';
    g.font = '700 40px ' + FONT_STACK;
    g.fillText(label, 0, PY + PS + 62);
    paintTape(g, 0, -CH / 2 + 4, 170, 52, tapeAng, tapeFill);
    g.restore();
  }
  function paintStamp(g, cx, cy, dateText) {
    const w = 480, h = 120, ink = 'rgba(176,64,52,0.88)';
    g.save();
    g.translate(cx, cy);
    g.rotate(-0.05);
    g.strokeStyle = ink;
    g.lineWidth = 5;
    roundRectPath(g, -w / 2, -h / 2, w, h, 16);
    g.stroke();
    g.lineWidth = 2;
    roundRectPath(g, -w / 2 + 9, -h / 2 + 9, w - 18, h - 18, 10);
    g.stroke();
    g.fillStyle = ink;
    g.textAlign = 'center';
    g.textBaseline = 'middle';
    if ('letterSpacing' in g) g.letterSpacing = '4px';
    g.font = '700 26px ' + FONT_STACK;
    g.fillText(APP_NAME, 0, -22);
    if ('letterSpacing' in g) g.letterSpacing = '2px';
    g.font = '800 46px ' + FONT_STACK;
    g.fillText(dateText, 0, 24);
    g.restore();
  }

  const pad2 = (n) => String(n).padStart(2, '0');
  function makeFileName(title, d) {
    let t = title.replace(/[\\/:*?"<>|\u0000-\u001f]/g, '_').trim();
    t = Array.from(t).slice(0, 40).join('').replace(/[. ]+$/, '');
    if (!t) t = DEFAULT_TITLE;
    const stamp = d.getFullYear() + pad2(d.getMonth() + 1) + pad2(d.getDate()) + '-' +
      pad2(d.getHours()) + pad2(d.getMinutes()) + pad2(d.getSeconds());
    return t + '_' + stamp + '.png';
  }
  function composeImage(title, d) {
    const W = 1080, H = 1350;
    const c = document.createElement('canvas');
    c.width = W; c.height = H;
    const g = c.getContext('2d');
    g.imageSmoothingQuality = 'high';
    paintPaper(g, W, H);

    paintTape(g, W / 2, 92, 300, 62, -0.04, 'rgba(236,170,128,0.88)');
    g.fillStyle = '#4b3a2a';
    g.textAlign = 'center';
    g.textBaseline = 'middle';
    const t = layoutTitle(g, title, 760);
    const lh = t.size * 1.18;
    const top = 215 - (lh * (t.lines.length - 1)) / 2;
    t.lines.forEach((ln, i) => g.fillText(ln, W / 2, top + i * lh));
    const wy = 215 + (lh * (t.lines.length - 1)) / 2 + t.size * 0.5 + 24;
    g.save();
    g.strokeStyle = 'rgba(201,96,74,0.85)';
    g.lineWidth = 5;
    g.lineCap = 'round';
    g.beginPath();
    for (let x = -170; x <= 170; x += 4) {
      const px = W / 2 + x, py = wy + Math.sin(x / 14) * 6;
      if (x === -170) g.moveTo(px, py); else g.lineTo(px, py);
    }
    g.stroke();
    g.restore();
    paintStar(g, 96, 128, 30, '#e8b64a', 0.2);
    paintHeart(g, 984, 168, 26, '#e07a8a', 0.25);
    paintHeart(g, 84, 300, 17, '#e9a0a8', -0.3);
    paintStar(g, 1002, 316, 20, '#f0cc72', -0.2);
    paintStar(g, 170, 372, 13, '#d99a52', 0.4);
    paintHeart(g, 912, 392, 14, '#d9808c', -0.2);

    paintPolaroid(g, 290, 800, -0.07, (gg, x, y, s) => {
      gg.fillStyle = '#fff';
      gg.fillRect(x, y, s, s);
      if (sourceImage) drawContain(gg, sourceImage, x, y, s, s);
    }, '원본', 'rgba(244,196,120,0.88)', -0.12);
    paintPolaroid(g, 790, 835, 0.06, (gg, x, y, s) => {
      gg.fillStyle = '#fff';
      gg.fillRect(x, y, s, s);
      gg.drawImage(drawCanvas, x, y, s, s);
    }, '내 그림', 'rgba(150,204,190,0.88)', 0.1);

    paintStamp(g, W / 2, 1238, d.getFullYear() + '. ' + (d.getMonth() + 1) + '. ' + d.getDate() + '.');
    return c;
  }

  // ---------- 저장(제목 창 → PNG) ----------
  const saveModal = $('saveModal'), saveForm = $('saveForm'), titleInput = $('titleInput');
  function closeSaveModal() {
    saveModal.hidden = true;
    $('saveBtn').focus();
  }
  $('saveBtn').addEventListener('click', () => {
    if (cur) return;
    closePops();
    if (!sourceImage) {
      notify('먼저 따라 그릴 이미지를 불러오세요.', 'error');
      return;
    }
    titleInput.value = appTitle;
    saveModal.hidden = false;
    titleInput.focus();
    titleInput.select();
  });
  $('saveCancel').addEventListener('click', closeSaveModal);
  saveModal.addEventListener('pointerdown', (e) => { if (e.target === saveModal) closeSaveModal(); });
  saveModal.addEventListener('keydown', (e) => {
    if (e.key === 'Escape') { e.preventDefault(); closeSaveModal(); return; }
    if (e.key === 'Tab') {
      const items = [titleInput, $('saveCancel'), $('saveOk')];
      const i = items.indexOf(document.activeElement);
      e.preventDefault();
      items[(i + (e.shiftKey ? items.length - 1 : 1)) % items.length].focus();
    }
  });
  saveForm.addEventListener('submit', (e) => {
    e.preventDefault();
    appTitle = titleInput.value.replace(/\s+/g, ' ').trim();
    persist();
    saveModal.hidden = true;
    $('saveBtn').focus();
    downloadImage(appTitle || DEFAULT_TITLE);
  });
  function downloadImage(title) {
    const now = new Date();
    const name = makeFileName(title, now);
    let canvas;
    try {
      canvas = composeImage(title, now);
    } catch (err) {
      notify('저장 이미지를 만들지 못했어요. 다시 시도해 주세요.', 'error');
      return;
    }
    canvas.toBlob((blob) => {
      if (!blob) { notify('저장하지 못했어요. 다시 시도해 주세요.', 'error'); return; }
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url;
      a.download = name;
      document.body.appendChild(a);
      a.click();
      a.remove();
      setTimeout(() => URL.revokeObjectURL(url), 15000);
      notify('저장했어요: ' + name);
    }, 'image/png');
  }

  // ---------- 시작 ----------
  renderSource();
  redraw();
  updateGuide();
  updatePreview();
  updateSwatches();
  refreshUI();
  restore();
})();
</script>
</body>
